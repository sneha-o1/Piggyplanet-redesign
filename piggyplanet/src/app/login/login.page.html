<!-- Loader Animation -->
<div class="loader-container" *ngIf="showLoader">
  <div id="login-loader" class="login-loader"></div>
</div>

<ion-content class="login-content" [class.hidden]="showLoader">
  <!-- Animated Background -->
  <div class="background-animation"></div>

  <div class="login-container">
    <!-- Header -->
    <div class="login-header">
      <div class="logo-section">
        <div id="login-logo" class="login-logo" style="width: 100px; height: 100px;"></div>
        <h1>PiggyPlanet</h1>
        <p>Grow your money, grow your dreams!</p>
      </div>
    </div>

    <!-- Login / Signup Tabs -->
    <div class="tabs-container">
      <div class="tabs">
        <button class="tab-button" [class.active]="currentTab === 'login'" 
                (click)="switchTab('login')">
          Login
        </button>
        <button class="tab-button" [class.active]="currentTab === 'signup'" 
                (click)="switchTab('signup')">
          Sign Up
        </button>
      </div>

      <!-- LOGIN FORM -->
      <div class="form-container" *ngIf="currentTab === 'login'">
        <form class="login-form" (ngSubmit)="onLogin()">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-input" [(ngModel)]="loginData.username"
                   name="loginUsername" required>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" [(ngModel)]="loginData.password"
                   name="loginPassword" required>
          </div>

          <!-- REMOVED routerLink -->
          <button type="submit" class="submit-button login-btn">
            <ion-icon name="rocket-outline"></ion-icon>
            Launch to PiggyPlanet!
          </button>
        </form>
      </div>

      <!-- SIGNUP FORM -->
      <div class="form-container" *ngIf="currentTab === 'signup'">
        <form class="signup-form" (ngSubmit)="onSignup()">
          <div class="form-group">
            <label class="form-label">Choose Username</label>
            <input type="text" class="form-input" [(ngModel)]="signupData.username"
                   name="signupUsername" required>
          </div>

          <div class="form-group">
            <label class="form-label">Create Password</label>
            <input type="password" class="form-input" [(ngModel)]="signupData.password"
                   name="signupPassword" required>
          </div>

          <!-- REMOVED routerLink -->
          <button type="submit" class="submit-button signup-btn">
            <ion-icon name="star-outline"></ion-icon>
            Start Your Journey!
          </button>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <p>🌟 Start saving today and watch your dreams grow! 🌟</p>
    </div>
  </div>
</ion-content>
